
# Application
spring.application.name=marz-scheduler
server.port=8080

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://postgres:5432/zosscheduler}
spring.datasource.username=${DB_USERNAME:scheduler}
spring.datasource.password=${POSTGRES_PASSWORD:devpassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Flyway database migrations
spring.flyway.enabled=true

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# Logging
logging.level.com.marz.scheduler=INFO

# Scheduler Interval
marz.scheduler.poll-interval-ms=5000

# Worker Interval 
marz.worker.poll-interval-ms=2000

# z/OSMF connection
marz.zosmf.base-url=${ZOSMF_BASE_URL:https://S0W1.DAL-EBIS.IHOST.COM:10443}
marz.zosmf.username=${ZOS_USER:}
marz.zosmf.password=${ZOS_PASSWORD:}
marz.zosmf.connect-timeout-seconds=10
marz.zosmf.read-timeout-seconds=30